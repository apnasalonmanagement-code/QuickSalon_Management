name: quick_salon_management
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.17.2

  # State Management
  provider: ^6.1.5+1

  # UI / Utilities
  intl: ^0.20.2

  # Images
  cached_network_image: ^3.4.1

  # Image Picker
  image_picker: ^1.2.1

  # URL / Location
  url_launcher: ^6.3.2

  # Local Storage
  shared_preferences: ^2.5.3

  # UUID
  uuid: ^4.5.1

  # Connectivity
  connectivity_plus: ^7.0.0

  # Calendar
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

# ============================================================
# APP ICON CONFIGURATION
# ============================================================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/app_icon.png"

  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"

  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"